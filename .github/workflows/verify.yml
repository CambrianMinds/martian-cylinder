name: Peer-Review Verification Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify Telemetry, Geometry & Statistics
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full NASA PDS Archive Verification Suite
        run: |
          python reproduce_analysis.py

      - name: Run Lightweight Sandbox Verification (--crop-only)
        run: |
          python reproduce_analysis.py --crop-only


      - name: Unit tests (independent reference values)
        run: |
          python -m unittest discover -s tests -v

      - name: Audit re-analysis
        run: |
          python audit_reanalysis.py

      - name: Phase II Re-analysis & Validation
        run: |
          python compile_phase2_reanalysis.py

  js-tests:
    name: Projection engine tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/cylinder_projection.test.js
