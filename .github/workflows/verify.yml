name: Current manuscript and evidence verification

on: [push, pull_request]

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}/independent-reconstruction/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install current paper dependencies
        run: python -m pip install -r papers/requirements.txt
      - name: Verify comparison measurements
        run: python papers/run_comparison_checks.py
      - name: Verify independent audit invariants
        run: python -m unittest discover -s audit/tests -v
      - name: Verify finite geometry and historical provenance
        run: python -m unittest discover -s audit/sediment-pipe-comparison/tests -v
      - name: Regenerate figures and verify paper evidence
        run: python papers/build_paper_evidence.py
      - name: Check current documents and relocated data paths
        run: python papers/check_repository.py
