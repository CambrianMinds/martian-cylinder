name: Current manuscript and evidence verification

on: [push, pull_request]

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}/independent-reconstruction/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install current paper dependencies
        run: python -m pip install -r papers/requirements.txt
      - name: Verify comparison measurements
        run: python papers/run_comparison_checks.py
      - name: Verify independent audit invariants
        run: python -m unittest discover -s audit/tests -v
      - name: Verify finite geometry and historical provenance
        run: python -m unittest discover -s audit/sediment-pipe-comparison/tests -v
      - name: Regenerate figures and verify paper evidence
        run: python papers/build_paper_evidence.py
      - name: Check current documents and relocated data paths
        run: python papers/check_repository.py

  manuscript:
    name: Build and verify the LaTeX manuscript
    needs: verify
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}/independent-reconstruction/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install current paper dependencies
        run: python -m pip install -r papers/requirements.txt
      - name: Regenerate authentic-image figures and evidence manifest
        run: python papers/build_paper_evidence.py
      - name: Compile the manuscript with XeLaTeX
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          working_directory: papers
          root_file: martian-cylinder-technical-paper.tex
          texlive_version: "2026"
          latexmk_use_xelatex: true
      - name: Verify the compiled manuscript and matching distribution
        run: |
          python -c "from shutil import copyfile; copyfile('papers/martian-cylinder-technical-paper.pdf', 'martian-cylinder-technical-paper.pdf')"
          python papers/verify_journal_revision.py
          python papers/check_repository.py
      - name: Upload the verified manuscript and provenance records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-technical-manuscript
          if-no-files-found: error
          path: |
            papers/martian-cylinder-technical-paper.pdf
            papers/journal-numerical-verification.json
            papers/paper-evidence-manifest.json
            papers/figure-provenance.json
